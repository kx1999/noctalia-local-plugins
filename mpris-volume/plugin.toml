# MPRIS Volume - control one specific MPRIS player through `noctalia msg
# plugin`: its own app-level volume (not the system mixer) and its transport
# (play/pause/next/previous/stop/seek). No popups; errors go to the log.
# Uses playerctl under the hood.

id = "kylex/mpris-volume"
name = "MPRIS Volume"
version = "1.2.0"
plugin_api = 43
author = "kylex"
license = "MIT"
tags = ["audio", "media", "service", "utility"]
icon = "volume"
description = "Control one chosen MPRIS player from shell commands: volume up/down/set/mute plus play, pause, toggle, next, previous, stop and seek."

[[setting]]
key = "player"
type = "string"
label_key = "settings.player.label"
description_key = "settings.player.description"
default = "ytmdesktop"

[[setting]]
key = "step"
type = "int"
label_key = "settings.step.label"
description_key = "settings.step.description"
default = 5
min = 1
max = 50

[[setting]]
key = "max_volume"
type = "int"
label_key = "settings.max_volume.label"
description_key = "settings.max_volume.description"
default = 100
min = 1
max = 200

[[service]]
id = "service"
entry = "service.luau"
